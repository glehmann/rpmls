name: release

# Only do the release on x.y.z tags.
on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  # The create-release job runs purely to initialize the GitHub release itself,
  # and names the release after the `x.y.z` tag that was pushed. It's separate
  # from building the release so that we only create the release once.
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    # We need this to be able to create releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get the release version from the tag
        if: env.VERSION == ''
        run: echo "VERSION=$REFNAME" >> $GITHUB_ENV
        env:
          REFNAME: ${{ github.ref_name }}
      - name: Check that tag version and Cargo.toml version are the same
        shell: bash
        run: |
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            echo "version does not match Cargo.toml" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $VERSION --draft --verify-tag --title $VERSION
    outputs:
      version: ${{ env.VERSION }}

  # Static binaries, for the containers of any distribution.
  build-release:
    name: build-release
    needs: ['create-release']
    runs-on: ${{ matrix.os }}
    # We need this to upload the artifacts
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-amd64
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: linux-arm64
            os: ubuntu-24.04-arm
            rust: stable
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup install ${{ matrix.rust }} --target ${{ matrix.target }}

      # the C code of the tree-sitter parser, for musl
      - run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> $GITHUB_ENV
        env:
          TARGET: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          cargo +${{ matrix.rust }} build --target ${{ matrix.target }} --release
          echo "BIN=$PWD/target/${{ matrix.target }}/release/rpmls" >> $GITHUB_ENV

      - name: Determine archive name
        shell: bash
        run: |
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCHIVE=rpmls-$VERSION-${{ matrix.target }}" >> $GITHUB_ENV
        env:
          VERSION: ${{ needs.create-release.outputs.version }}

      # the binary at the top of the archive, where xcraft extracts it from
      - name: Build archive
        shell: bash
        run: |
          mkdir archive
          cp $BIN README.md LICENSE archive/
          tar czf "$ARCHIVE.tar.gz" -C archive rpmls README.md LICENSE
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV

      - name: Upload release archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$VERSION" $ASSET $ASSET_SUM
