name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # rust channels
          - build: stable
            os: ubuntu-24.04
            rust: stable
            target: x86_64-unknown-linux-gnu
          - build: beta
            os: ubuntu-24.04
            rust: beta
            target: x86_64-unknown-linux-gnu
          - build: nightly
            os: ubuntu-24.04
            rust: nightly
            target: x86_64-unknown-linux-gnu

          # release platforms: static binaries, for the containers of any distribution
          - build: linux-amd64
            os: ubuntu-24.04
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: linux-arm64
            os: ubuntu-24.04-arm
            rust: stable
            target: aarch64-unknown-linux-musl
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: rustup install ${{ matrix.rust }} --target ${{ matrix.target }}
    # the C code of the tree-sitter parser, for musl
    - if: endsWith(matrix.target, '-musl')
      run: |
        sudo apt-get update && sudo apt-get install -y musl-tools
        echo "CC_${TARGET//-/_}=musl-gcc" >> $GITHUB_ENV
      env:
        TARGET: ${{ matrix.target }}
    - run: cargo +${{ matrix.rust }} build --target ${{ matrix.target }}
    - run: cargo +${{ matrix.rust }} test --target ${{ matrix.target }}

  rustfmt:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: rustup install stable --component rustfmt
    - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: rustup install stable --component clippy
    - run: cargo clippy --all-targets -- -D warnings

  ci-ok:
    if: always()
    needs:
      - test
      - rustfmt
      - clippy
    runs-on: ubuntu-24.04
    steps:
    - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: exit 1

  dependabot-auto-merge:
    needs: ci-ok
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event_name == 'pull_request' }}
    steps:
    - run: gh pr merge --auto --rebase "$PR_URL"
      env:
        PR_URL: ${{github.event.pull_request.html_url}}
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx zizmor .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
